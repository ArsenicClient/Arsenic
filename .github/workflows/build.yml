name: Build

on:
  push:
    branches: [ main, latest ]
  pull_request:
    branches: [ main, latest ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Permissions
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build
