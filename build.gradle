buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://files.minecraftforge.net/maven"
        }
        maven {
            url = "https://jitpack.io"
        }
        maven {
            name = "SpongePowered"
            url = "https://repo.spongepowered.org/repository/maven-public/"
        }
        maven {
            url = "https://plugins.gradle.org/m2"
        }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
        classpath "org.spongepowered:mixingradle:0.6-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"
apply plugin: "org.spongepowered.mixin"
apply plugin: "idea"

version          = "v2.0"
group            = "arsenic"
archivesBaseName = "Arsenic"

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8
compileJava.options.encoding = "UTF-8"

minecraft {
    version    = "1.8.9-11.15.1.2318-1.8.9"
    runDir     = "run"
    mappings   = "stable_20"
    clientJvmArgs += "-Dfml.coreMods.load=arsenic.injection.MixinLoader"
}

repositories {
    mavenCentral()
    maven {
        name = "forge"
        url  = "https://maven.minecraftforge.net"
    }
    maven {
        name = "SpongePowered"
        url  = "https://repo.spongepowered.org/repository/maven-public/"
    }
    jcenter()
}

def relocatedAsmJar = file("$buildDir/relocated/asm-9.7-arsenic.jar")

configurations {
    embed
    compile.extendsFrom embed
    lunarNames
    shadedAsm
}

dependencies {
    embed("org.spongepowered:mixin:0.6.12-SNAPSHOT") {
        exclude module: "launchwrapper"  // provided by Forge
        exclude module: "guava"          // provided by Minecraft
        exclude module: "gson"           // provided by Minecraft
        exclude module: "log4j"          // provided by Minecraft
        exclude module: "commons-io"     // provided by Minecraft/Forge
    }
    compileOnly "org.jetbrains:annotations:23.0.0"
    embed 'com.jagrosh:DiscordIPC:0.4'
    embed("org.reflections:reflections:0.10.2") {
        exclude module: "guava"  // provided by Minecraft
    }
    embed("org.javassist:javassist:3.28.0-GA")
    // Compiles addon .java files at runtime without needing a JDK (3.26 is the last release that runs on Java 8)
    embed("org.eclipse.jdt:ecj:3.26.0")
    // The injector's agent rewrites game classes with ASM: a current one (Lunar runs Java 17 classes), moved to
    // arsenic.lib.asm so it never meets the game's own ASM (Forge has 5.0, vanilla none, Lunar its own). See relocateAsm.
    shadedAsm "org.ow2.asm:asm:9.7"
    shadedAsm "org.ow2.asm:asm-tree:9.7"
    shadedAsm "org.ow2.asm:asm-commons:9.7"
    embed files(relocatedAsmJar) { builtBy "relocateAsm" }
    // Lunar Client runs 1.8.9 with the last MCP names (stable_22), which name a few members stable_20 leaves as SRG
    lunarNames "de.oceanlabs.mcp:mcp_stable:22-1.8.9@zip"
}

// ASM 9 with its packages renamed from org.objectweb.asm to arsenic.lib.asm (the build's own ASM does the renaming)
task relocateAsm {
    inputs.files configurations.shadedAsm
    outputs.file relocatedAsmJar
    doLast {
        def remapper = new org.objectweb.asm.commons.Remapper() {
            @Override
            String map(String typeName) {
                return typeName.startsWith("org/objectweb/asm/") ? "arsenic/lib/asm/" + typeName.substring(18) : typeName
            }
        }
        relocatedAsmJar.parentFile.mkdirs()
        new java.util.zip.ZipOutputStream(new FileOutputStream(relocatedAsmJar)).withCloseable { out ->
            configurations.shadedAsm.each { File lib ->
                new java.util.zip.ZipFile(lib).withCloseable { zip ->
                    zip.entries().each { e ->
                        if (!e.name.endsWith(".class") || e.name.contains("module-info")) return
                        def writer = new org.objectweb.asm.ClassWriter(0)
                        new org.objectweb.asm.ClassReader(zip.getInputStream(e).bytes)
                                .accept(new org.objectweb.asm.commons.RemappingClassAdapter(writer, remapper), org.objectweb.asm.ClassReader.EXPAND_FRAMES)
                        out.putNextEntry(new java.util.zip.ZipEntry(remapper.map(e.name.substring(0, e.name.length() - 6)) + ".class"))
                        out.write(writer.toByteArray())
                        out.closeEntry()
                    }
                }
            }
        }
    }
}
compileJava.dependsOn relocateAsm

// SRG -> runtime names for the injector (arsenic.runtime.RuntimeNames), from the srgs ForgeGradle set up:
//   "C srg notch super interfaces..."  every class, with its super types as SRG names (members are looked up the hierarchy)
//   "F srgOwner srgName notchName"     fields, owner is the declaring class
//   "M srgOwner srgName srgDesc notch" methods, owner is the declaring class
//   "L srgName mcpName"                Lunar Client's MCP names (stable_22) for SRG member names
def writeInjectMappings = { File srgDir, File out ->
    def notchSrg = new File(srgDir, "notch-srg.srg")
    def vanillaJar = file("${gradle.gradleUserHomeDir}/caches/minecraft/net/minecraft/minecraft/1.8.9/minecraft-1.8.9.jar")
    if (!notchSrg.exists() || !vanillaJar.exists())
        throw new GradleException("Missing ${notchSrg} or ${vanillaJar}; run the ForgeGradle setup first")

    def classes = [:]   // notch -> srg
    notchSrg.eachLine { line ->
        def p = line.split(" ")
        if (p[0] == "CL:") classes[p[1]] = p[2]
    }
    def supers = [:]    // srg -> [super, interfaces...] as SRG names
    new java.util.zip.ZipFile(vanillaJar).withCloseable { zip ->
        zip.entries().each { e ->
            if (!e.name.endsWith(".class")) return
            def reader = new org.objectweb.asm.ClassReader(zip.getInputStream(e).bytes)
            def name = reader.className
            def srg = classes[name] ?: name
            def list = [reader.superName] + (reader.interfaces as List)
            supers[srg] = list.findAll { it != null }.collect { classes[it] ?: it }
        }
    }
    def notchOf = [:]
    classes.each { notch, srg -> notchOf[srg] = notch }

    out.withWriter("UTF-8") { w ->
        supers.each { srg, list -> w.write("C ${srg} ${notchOf[srg] ?: srg} ${list.join(' ')}".trim() + "\n") }
        notchSrg.eachLine { line ->
            def p = line.split(" ")
            if (p[0] == "FD:") {
                def owner = p[2].substring(0, p[2].lastIndexOf("/"))
                w.write("F ${owner} ${p[2].substring(owner.length() + 1)} ${p[1].substring(p[1].lastIndexOf('/') + 1)}\n")
            } else if (p[0] == "MD:") {
                def owner = p[3].substring(0, p[3].lastIndexOf("/"))
                w.write("M ${owner} ${p[3].substring(owner.length() + 1)} ${p[4]} ${p[1].substring(p[1].lastIndexOf('/') + 1)}\n")
            }
        }
        def zip = configurations.lunarNames.singleFile
        new java.util.zip.ZipFile(zip).withCloseable { z ->
            ["fields.csv", "methods.csv"].each { csv ->
                z.getInputStream(z.getEntry(csv)).getText("UTF-8").eachLine { line, n ->
                    if (n == 0) return
                    def p = line.split(",")
                    if (p.length >= 2 && p[0] != p[1]) w.write("L ${p[0]} ${p[1]}\n")
                }
            }
        }
    }
}



// MCP -> SRG member names, bundled so addons written with MCP names can be remapped inside the obfuscated game.
def addonMappingsDir = file("$buildDir/generated/addon")
task generateAddonMappings {
    inputs.files configurations.lunarNames
    outputs.dir addonMappingsDir
    if (tasks.findByName("genSrgs") != null)
        dependsOn "genSrgs"

    doLast {
        def mcpSrg = file("${gradle.gradleUserHomeDir}/caches/minecraft/de/oceanlabs/mcp/mcp_stable/20/srgs/mcp-srg.srg")
        if (!mcpSrg.exists())
            throw new GradleException("Missing ${mcpSrg}; run the ForgeGradle setup first")
        addonMappingsDir.mkdirs()
        def out = new File(addonMappingsDir, "addon-mappings.txt")
        out.withWriter("UTF-8") { w ->
            mcpSrg.eachLine { line ->
                def p = line.split(" ")
                if (p[0] == "FD:" && p.length == 3) {
                    def mcp = p[1], srg = p[2]
                    def owner = mcp.substring(0, mcp.lastIndexOf("/"))
                    def mcpName = mcp.substring(mcp.lastIndexOf("/") + 1)
                    def srgName = srg.substring(srg.lastIndexOf("/") + 1)
                    if (mcpName != srgName) w.write("F ${owner} ${mcpName} ${srgName}\n")
                } else if (p[0] == "MD:" && p.length == 5) {
                    def mcp = p[1], srg = p[3]
                    def owner = mcp.substring(0, mcp.lastIndexOf("/"))
                    def mcpName = mcp.substring(mcp.lastIndexOf("/") + 1)
                    def srgName = srg.substring(srg.lastIndexOf("/") + 1)
                    if (mcpName != srgName) w.write("M ${owner} ${mcpName} ${p[2]} ${srgName}\n")
                }
            }
        }
        writeInjectMappings(mcpSrg.parentFile, new File(addonMappingsDir, "inject-mappings.txt"))
    }
}

// API.md: the public surface addons can call, scanned from the sources (tools/apidump/ApiDump.java) so it cannot
// drift from the code. Written to build/generated/addon-api and bundled into the jar next to the addons.
def addonApiDir = file("$buildDir/generated/addon-api")
task generateAddonApi {
    def apiEntries = [
            "arsenic/module/Module.java", "arsenic/module/ModuleInfo.java", "arsenic/module/ModuleCategory.java",
            "arsenic/module/ModuleTier.java", "arsenic/module/property",
            "arsenic/event/types", "arsenic/event/impl", "arsenic/event/bus/Listener.java",
            "arsenic/event/bus/annotations", "arsenic/event/bus/Priorities.java",
            "arsenic/asm/RequiresPlayer.java", "arsenic/command/Command.java", "arsenic/command/CommandInfo.java",
            "arsenic/main/Arsenic.java", "arsenic/gui/hud/HudElement.java", "arsenic/injection/accessor",
            "arsenic/utils/rotations", "arsenic/utils/timer", "arsenic/utils/java", "arsenic/utils/minecraft",
            "arsenic/utils/render/DrawUtils.java", "arsenic/utils/render/RenderUtils.java",
            "arsenic/utils/lag/LagManager.java"
    ]
    inputs.dir "src/main/java"
    inputs.file "tools/apidump/ApiDump.java"
    outputs.dir addonApiDir
    outputs.file "ADDONS.md"

    doLast {
        def classes = file("$buildDir/tmp/apidump")
        classes.mkdirs()
        ant.javac(srcdir: file("tools/apidump"), destdir: classes, includeantruntime: false, source: "1.8", target: "1.8")
        addonApiDir.mkdirs()
        javaexec {
            classpath classes
            main = "ApiDump"
            args([file("src/main/java").absolutePath, new File(addonApiDir, "API.md").absolutePath] + apiEntries)
        }
        // embed the dump at the bottom of ADDONS.md between its markers
        def doc = file("ADDONS.md")
        def api = new File(addonApiDir, "API.md").getText("UTF-8")
                .replaceFirst(/(?s)^.*?\n(?=## )/, "")
                .replaceAll(/(?m)^## /, "### ")
        def text = doc.getText("UTF-8")
        def begin = "<!-- API:BEGIN -->", end = "<!-- API:END -->"
        int b = text.indexOf(begin), e = text.indexOf(end)
        if (b >= 0 && e > b) {
            def updated = text.substring(0, b + begin.length()) + "\n" + api.trim() + "\n" + text.substring(e)
            if (updated != text) doc.write(updated, "UTF-8")
        }
    }
}

processResources {
    dependsOn generateAddonMappings
    dependsOn generateAddonApi
    from(addonApiDir) { into "assets/arsenic/addons" }
    from("src/addons") {
        include "addons.json"
        include "java/*.java"
        include "packs/**"
        into "assets/arsenic/addons"
    }
    from(addonMappingsDir)
    inputs.property "version",   project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand version: project.version, mcversion: project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}



// Default addons: ordinary modules written exactly like user addons (MCP names, default package). They are
// compiled here as a check and so IDEs treat them as source, but they are not part of the jar's classes; their
// .java sources are bundled as resources and copied into the Arsenic/addons folder at startup. Loose addons live
// in src/addons/java, each pack in src/addons/packs/<id> with a pack.json and its addons in impl.
def addonSourceDirs = [file("src/addons/java")]
file("src/addons/packs").listFiles({ File f -> f.isDirectory() } as FileFilter)?.each { File pack ->
    File impl = new File(pack, "impl")
    if (impl.isDirectory()) addonSourceDirs << impl
}
sourceSets {
    addons {
        java.srcDirs = addonSourceDirs
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
build.dependsOn "compileAddonsJava"
mixin {
    add sourceSets.main, "mixins.arsenic.refmap.json"
}

def configureArsenicJar = { Jar task ->
    task.from(configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
        exclude "META-INF/maven/**"
        exclude "META-INF/MUMFREY.RSA"
        exclude "LICENSE.txt"
        exclude "dummyThing"
    }

    task.manifest.attributes(
            "MixinConfigs"               : "mixins.arsenic.json",
            "tweakClass"                 : "org.spongepowered.asm.launch.MixinTweaker",
            "TweakOrder"                 : 0,
            "FMLCorePlugin"              : "arsenic.injection.MixinLoader",
            "FMLCorePluginContainsFMLMod": true,
            "ForceLoadAsMod"             : true,
            "ModSide"                    : "CLIENT",
            // double-clicking the jar opens the injector, which loads it into a running game as a Java agent
            "Main-Class"                 : "arsenic.inject.Injector",
            "Agent-Class"                : "arsenic.inject.Agent",
            "Can-Retransform-Classes"    : true,
            "Can-Redefine-Classes"       : true
    )
}

jar {
    configureArsenicJar(delegate)
}

// Second jar built alongside the normal one on every `gradle build`.
// Same contents, plus a devmode.properties (devmode=true) and a "DevMode" manifest attribute.
task devJar(type: Jar) {
    classifier = "dev"
    from sourceSets.main.output
    from(file("$buildDir/devmode")) {
        include "devmode.properties"
    }
    configureArsenicJar(delegate)
    manifest.attributes("DevMode": true)

    doFirst {
        def dir = file("$buildDir/devmode")
        dir.mkdirs()
        new File(dir, "devmode.properties").text = "devmode=true\n"
    }
}

// Obfuscate the dev jar the same way as the main one, then hook it into `build`.
reobf {
    devJar { mappingType = "SEARGE" }
}
build.dependsOn devJar

// reobf rewrites every class in the jar with an old ASM, which mangles the stack map frames of the embedded
// libraries (ECJ then fails verification). Only Arsenic's own classes need remapping, so put the libraries'
// original classes back once reobf is done.
def restoreEmbeddedLibs = { File jarFile ->
    def originals = [:]
    configurations.embed.each { File lib ->
        if (!lib.isFile()) return
        new java.util.zip.ZipFile(lib).withCloseable { zip ->
            zip.entries().each { e ->
                if (!e.isDirectory() && e.name.endsWith(".class") && !originals.containsKey(e.name))
                    originals[e.name] = zip.getInputStream(e).bytes
            }
        }
    }
    def tmp = new File(jarFile.parentFile, jarFile.name + ".restore")
    new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
        new java.util.zip.ZipOutputStream(new FileOutputStream(tmp)).withCloseable { out ->
            zip.entries().each { e ->
                def entry = new java.util.zip.ZipEntry(e.name)
                entry.time = e.time
                out.putNextEntry(entry)
                if (!e.isDirectory()) {
                    boolean lib = e.name.endsWith(".class") && (!e.name.startsWith("arsenic/") || e.name.startsWith("arsenic/lib/")) && originals.containsKey(e.name)
                    out.write(lib ? originals[e.name] : zip.getInputStream(e).bytes)
                }
                out.closeEntry()
            }
        }
    }
    jarFile.delete()
    tmp.renameTo(jarFile)
}
afterEvaluate {
    tasks.reobfJar.doLast { restoreEmbeddedLibs(tasks.getByName("jar").archivePath) }
    tasks.reobfDevJar.doLast { restoreEmbeddedLibs(tasks.getByName("devJar").archivePath) }
}

idea {
    module {
        inheritOutputDirs = true
        sourceDirs += addonSourceDirs
    }
}
