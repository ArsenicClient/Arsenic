plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.jagrosh' }
    }
}

loom {
    mods {
        "arsenic" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Bundled into the jar with Loom's jar-in-jar
    implementation include("com.github.jagrosh:DiscordIPC:${project.discord_ipc_version}") {
        transitive = false
    }
    implementation include("org.json:json:20230227")
    // DiscordIPC talks to Discord over a unix socket on Linux/macOS
    implementation include("com.kohlschutter.junixsocket:junixsocket-common:2.6.2")
    implementation include("com.kohlschutter.junixsocket:junixsocket-native-common:2.6.2")
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    it.options.compilerArgs += ["-Xmaxerrs", "10000"]
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Second jar built alongside the normal one on every `gradle build`: the same contents plus a
// devmode.properties, which unlocks the DEV-tier modules (see ModuleManager).
def devmodeDir = layout.buildDirectory.dir("devmode")
tasks.register("devJar", Jar) {
    archiveClassifier = "dev"
    dependsOn jar
    from(zipTree(jar.archiveFile)) {
        exclude "META-INF/MANIFEST.MF"
    }
    from(devmodeDir)
    manifest {
        from(jar.manifest)
        attributes("DevMode": true)
    }
    doFirst {
        def dir = devmodeDir.get().asFile
        dir.mkdirs()
        new File(dir, "devmode.properties").text = "devmode=true\n"
    }
}
build.dependsOn devJar

loom {
    runs {
        client {
            // forces every mixin to apply at startup, see Arsenic#onInitializeClient
            vmArg "-Darsenic.auditMixins=true"
        }
    }
}
